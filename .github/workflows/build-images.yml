name: Build immutable images
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web,api,worker]
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: infra/docker/Dockerfile.${{ matrix.service }}
        push: true
        tags: ghcr.io/${{ github.repository }}/portal-${{ matrix.service }}:${{ github.sha }}
        provenance: true
        sbom: true
    - name: Scan image
      uses: aquasecurity/trivy-action@0.33.1
      with:
        image-ref: ghcr.io/${{ github.repository }}/portal-${{ matrix.service }}:${{ github.sha }}
        format: table
        exit-code: "1"
        severity: CRITICAL,HIGH
