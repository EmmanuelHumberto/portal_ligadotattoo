name: AR43 Full Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://portal:portal_ci@localhost:5432/portal
      PORT_API: 3001
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://portal:portal_ci@localhost:5432/portal
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: 22, cache: npm}
    - run: npm ci
    - run: npm run db:migrate
    - run: npm run verify:full
