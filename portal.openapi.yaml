components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
    internalKey:
      type: apiKey
      in: header
      name: x-internal-key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 24}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Aggregate version, formatted as a quoted integer ETag.
      schema: {type: string, pattern: '^"[0-9]+"$'}
  responses:
    Unauthorized:
      description: Authentication required
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource not found
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Conflict
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ConcurrentModification:
      description: Aggregate changed since client read
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Validation:
      description: Validation failed
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ValidationProblem'}}}
  schemas:
    Uuid:
      type: string
      format: uuid
    AIExecutionLedger:
      type: object
      required: [items,attempts,budgets]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AIExecution'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/AIExecutionAttempt'}
        budgets:
          type: array
          items: {$ref: '#/components/schemas/AIWorkloadBudget'}
    AIExecution:
      type: object
      required: [id,workload_key,status,attempt_count,estimated_cost_usd,created_at]
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        workload_key: {type: string}
        provider_key: {type: [string,'null']}
        model_key: {type: [string,'null']}
        status: {type: string, enum: [RUNNING,SUCCEEDED,FAILED]}
        attempt_count: {type: integer, minimum: 0}
        estimated_cost_usd: {type: [number,string]}
        created_at: {type: string, format: date-time}
    AIExecutionAttempt:
      type: object
      required: [id,execution_id,attempt_no,provider_key,model_key,status,reserved_cost_usd,created_at]
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        execution_id: {$ref: '#/components/schemas/Uuid'}
        attempt_no: {type: integer, minimum: 1}
        provider_key: {type: string}
        model_key: {type: string}
        status: {type: string, enum: [RUNNING,SUCCEEDED,FAILED]}
        reserved_cost_usd: {type: [number,string]}
        estimated_cost_usd: {type: [number,string,'null']}
        error_code: {type: [string,'null']}
        created_at: {type: string, format: date-time}
    AIWorkloadBudget:
      type: object
      required: [workload_key,day_cost_usd,month_cost_usd]
      properties:
        workload_key: {type: string}
        day_cost_usd: {type: [number,string]}
        month_cost_usd: {type: [number,string]}
        daily_budget_usd: {type: [number,string,'null']}
        monthly_budget_usd: {type: [number,string,'null']}
    Problem:
      type: object
      required: [type,title,status,code,correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        correlationId: {$ref: '#/components/schemas/Uuid'}
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field,code]
                properties:
                  field: {type: string}
                  code: {type: string}
                  message: {type: string}
    PageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor: {type: [string,'null']}
        hasMore: {type: boolean}
    Manufacturer:
      type: object
      required: [id,name,slug,status,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        slug: {type: string}
        officialWebsite: {type: [string,'null'], format: uri}
        countryCode: {type: [string,'null'], minLength: 2, maxLength: 2}
        status: {type: string, enum: [ACTIVE,INACTIVE,UNKNOWN]}
        version: {type: integer, minimum: 1}
    CreateManufacturerRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string}
        officialWebsite: {type: string, format: uri}
        countryCode: {type: string, minLength: 2, maxLength: 2}
    CreateProductRequest:
      type: object
      required: [manufacturerId,productTypeKey,name]
      additionalProperties: false
      properties:
        manufacturerId: {$ref: '#/components/schemas/Uuid'}
        brandId: {$ref: '#/components/schemas/Uuid'}
        productTypeKey: {type: string}
        name: {type: string, minLength: 1}
        slug: {type: string}
        modelCode: {type: string}
    UpdateProductRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string}
        brandId: {type: [string,'null'], format: uuid}
        modelCode: {type: [string,'null']}
        lifecycle: {type: string, enum: [ANNOUNCED,ACTIVE,DISCONTINUED,LEGACY,UNKNOWN]}
    AdminProductSummary:
      type: object
      required: [id,name,slug,manufacturerName,lifecycle,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        slug: {type: string}
        manufacturerName: {type: string}
        lifecycle: {type: string}
        version: {type: integer}
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductSummary'
        - type: object
          properties:
            claimsSummary: {type: object, additionalProperties: true}
            canonicalFacts: {type: array, items: {$ref: '#/components/schemas/CanonicalFact'}}
            media: {type: array, items: {$ref: '#/components/schemas/MediaAsset'}}
    PublicProductSummary:
      type: object
      required: [id,slug,name,manufacturer,manufacturerSlug,brand,type,productType,typeLabel,lifecycle]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        slug: {type: string}
        name: {type: string}
        manufacturer: {type: string}
        manufacturerSlug: {type: string}
        brand:
          type: object
          required: [name]
          properties:
            name: {type: string}
        type: {type: string}
        productType: {type: string}
        typeLabel: {type: string}
        lifecycle: {type: string}
        heroMedia:
          oneOf:
            - {$ref: '#/components/schemas/PublicMedia'}
            - {type: 'null'}
        offerFrom:
          oneOf:
            - type: object
              required: [amount,currency]
              properties:
                amount: {type: number}
                currency: {type: string}
            - {type: 'null'}
    PublicProduct:
      allOf:
        - {$ref: '#/components/schemas/PublicProductSummary'}
        - type: object
          required: [machineType,machineTypeLabel,canonicalSpecifications,specifications,media,documents,isSyntheticFixture]
          properties:
            machineType: {type: string}
            machineTypeLabel: {type: string}
            summary: {type: [string,'null']}
            description: {type: [string,'null']}
            canonicalSpecifications:
              type: array
              items: {$ref: '#/components/schemas/PublicSpecification'}
            specifications:
              type: array
              items: {$ref: '#/components/schemas/FormattedSpecification'}
            media:
              type: array
              items: {$ref: '#/components/schemas/PublicMedia'}
            documents:
              type: array
              items: {$ref: '#/components/schemas/PublicDocument'}
            offersSummary: {type: [object,'null'], additionalProperties: true}
            isSyntheticFixture: {type: boolean}
    PublicProductPage:
      type: object
      required: [items,meta]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicProductSummary'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    PublicSpecification:
      type: object
      required: [key,name,value]
      properties:
        key: {type: string}
        name: {type: string}
        value: {}
        unit: {type: [string,'null']}
    FormattedSpecification:
      type: object
      required: [key,label,value]
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: string}
    PublicDocument:
      type: object
      required: [id,title,url,mimeType,byteSize]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        url: {type: string}
        mimeType: {type: string}
        byteSize: {type: integer, minimum: 0}
    PublicMedia:
      type: object
      required: [url,kind]
      properties:
        url: {type: string, format: uri}
        kind: {type: string}
        attribution: {type: [string,'null']}
    SearchResultPage:
      type: object
      required: [items,meta]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchResult'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    SearchResult:
      type: object
      required: [type,id,title,url]
      properties:
        type: {type: string}
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        subtitle: {type: [string,'null']}
        url: {type: string}
    RecordClaimRequest:
      type: object
      required: [subjectType,subjectId,propertyKey,value,claimantType]
      additionalProperties: false
      properties:
        subjectType: {type: string}
        subjectId: {$ref: '#/components/schemas/Uuid'}
        propertyKey: {type: string}
        value: {}
        claimantType: {type: string}
        claimantId: {type: string}
        sourceSnapshotId: {$ref: '#/components/schemas/Uuid'}
        sourceUrl: {type: string, format: uri}
        observedAt: {type: string, format: date-time}
        confidence: {type: number, minimum: 0, maximum: 1}
    Claim:
      type: object
      required: [id,subjectType,subjectId,propertyKey,value,status,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        subjectType: {type: string}
        subjectId: {$ref: '#/components/schemas/Uuid'}
        propertyKey: {type: string}
        value: {}
        status: {type: string}
        version: {type: integer}
    CanonicalFact:
      type: object
      required: [id,propertyKey,value,validFrom,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        propertyKey: {type: string}
        value: {}
        validFrom: {type: string, format: date-time}
        validTo: {type: [string,'null'], format: date-time}
        version: {type: integer}
    CreateCanonicalProposalRequest:
      type: object
      required: [subjectType,subjectId,propertyKey,proposedValue,evidenceIds]
      properties:
        subjectType: {type: string}
        subjectId: {$ref: '#/components/schemas/Uuid'}
        propertyKey: {type: string}
        proposedValue: {}
        evidenceIds:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Uuid'}
    CanonicalProposal:
      type: object
      required: [id,status,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string}
        version: {type: integer}
    CanonicalDecisionRequest:
      type: object
      required: [decision,reason,expectedVersion]
      properties:
        decision: {type: string, enum: [APPROVE,REJECT]}
        reason: {type: string, minLength: 3}
        expectedVersion: {type: integer, minimum: 1}
    CanonicalDecisionResult:
      type: object
      required: [proposalId,decision]
      properties:
        proposalId: {$ref: '#/components/schemas/Uuid'}
        decision: {type: string, enum: [APPROVE,REJECT]}
        canonicalFact: {$ref: '#/components/schemas/CanonicalFact'}
    MediaRightsStatus:
      type: string
      enum: [UNKNOWN,PENDING,PERMITTED,RESTRICTED,EXPIRED,TAKEDOWN]
    RegisterMediaRequest:
      type: object
      required: [kind,storageKey,mimeType,byteSize,sha256]
      properties:
        kind: {type: string}
        storageKey: {type: string}
        mimeType: {type: string}
        byteSize: {type: integer, minimum: 0}
        sha256: {type: string}
    CreateCrawlTargetRequest:
      type: object
      required: [sourceId,url]
      additionalProperties: false
      properties:
        sourceId: {$ref: '#/components/schemas/Uuid'}
        url: {type: string, format: uri}
        discoveryMode: {type: string, enum: [EDITORIAL,CATALOG,MIXED,SNAPSHOT_ONLY], default: EDITORIAL}
        scheduleKey: {type: string, maxLength: 80}
        maxBytes: {type: integer, minimum: 1024, maximum: 26214400, default: 5000000}
    MediaAsset:
      type: object
      required: [id,kind,mimeType,rightsStatus,status,version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string}
        mimeType: {type: string}
        rightsStatus: {$ref: '#/components/schemas/MediaRightsStatus'}
        status: {type: string}
        version: {type: integer}
    RegisterSourceRequest:
      type: object
      required: [name,kind,baseUrl]
      additionalProperties: false
      properties:
        name: {type: string}
        kind: {type: string, enum: [MANUFACTURER,RETAILER,NEWS,EVENT,TECHNICAL,OTHER,SOCIAL]}
        baseUrl: {type: string, format: uri}
        allowedHosts: {type: array, maxItems: 100, items: {type: string}}
        robotsPolicy: {type: string, enum: [RESPECT,MANUAL_ALLOW,DISABLED]}
        crawlDelayMs: {type: integer, minimum: 250, maximum: 3600000}
    Source:
