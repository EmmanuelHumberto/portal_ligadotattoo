openapi: 3.1.0
info:
  title: Portal Tattoo API
  version: 1.0.0
  description: Public and administrative HTTP contract for Portal Tattoo.
servers:
  - url: /
tags:
  - name: Public Catalog
  - name: Public Search
  - name: Public Editorial
  - name: Public Commerce
  - name: Admin Catalog
  - name: Admin Knowledge
  - name: Admin Media
  - name: Admin Sources
  - name: Admin Ingestion
  - name: Admin Editorial
  - name: Admin Commerce
  - name: Admin AI
security: []
paths:
  /public/products:
    get:
      tags: [Public Catalog]
      operationId: listPublicProducts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: productType
          in: query
          schema: {type: string}
        - name: manufacturer
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProductPage'}
  /public/products/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getPublicProduct
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Public product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProduct'}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/search:
    get:
      tags: [Public Search]
      operationId: searchPublic
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: productType
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResultPage'}
  /public/search/suggest:
    get:
      tags: [Public Search]
      operationId: suggestPublicSearch
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SearchResult'}
  /public/editorial:
    get:
      tags: [Public Editorial]
      operationId: listPublishedEditorial
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/EditorialType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published editorial feed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EditorialPage'}
  /public/editorial/{slug}:
    get:
      tags: [Public Editorial]
      operationId: getPublishedEditorial
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Published content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicEditorialContent'}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/products/{slug}/offers:
    get:
      tags: [Public Commerce]
      operationId: getProductOffers
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Current offers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicOffer'}
  /public/products/{slug}/price-history:
    get:
      tags: [Public Commerce]
      operationId: getProductPriceHistory
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: window
          in: query
          schema: {type: string, enum: [30d, 90d, 180d, 1y, all], default: 90d}
      responses:
        '200':
          description: Price history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceHistory'}

  /public/products/facets:
    get:
      tags: [Public Catalog]
      operationId: getPublicProductFacets
      parameters:
        - name: productType
          in: query
          schema: {type: string}
        - name: manufacturer
          in: query
          schema: {type: string}
      responses:
        '200': {description: Product facets}
  /public/products/compare:
    get:
      tags: [Public Catalog]
      operationId: comparePublicProducts
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Up to four products for comparison}
  /public/manufacturers:
    get:
      tags: [Public Catalog]
      operationId: listPublicManufacturers
      responses:
        '200': {description: Public manufacturers}
  /public/manufacturers/{slug}:
    get:
      tags: [Public Catalog]
      operationId: getPublicManufacturer
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {description: Public manufacturer detail}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/offers:
    get:
      tags: [Public Commerce]
      operationId: listPublicOffers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: Fresh public offers}
  /public/offers/compare:
    get:
      tags: [Public Commerce]
      operationId: comparePublicOffers
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Offers selected for comparison}
  /public/products/{slug}/offers-v2:
    get:
      tags: [Public Commerce]
      operationId: getProductOffersV2
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {description: Current offers from the commerce projection}

  /admin/me:
    get:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: getAdminMe
      responses:
        '200':
          description: Current actor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminActor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/manufacturers:
    post:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: createManufacturer
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateManufacturerRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Manufacturer'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/products:
    get:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: listAdminProducts
      x-required-capability: catalog.read
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminProductSummary'}
    post:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: createProduct
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProductRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProduct'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/products/{id}:
    get:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: getAdminProduct
      x-required-capability: catalog.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProduct'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: updateAdminProduct
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProductRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminProduct'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/products/{id}/image:
    post:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: attachProductImage
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Image uploaded, permitted and linked}
  /admin/products/{id}/specs:
    post:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: replaceProductSpecifications
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201': {description: Canonical specifications updated}
  /admin/products/{id}/type:
    patch:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: changeProductType
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {description: Product type and canonical fact updated}
  /admin/products/{id}/meta:
    patch:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: updateProductMetadata
      x-required-capability: catalog.write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {description: Product metadata updated}
  /admin/products/discovery/run:
    post:
      tags: [Admin Catalog]
      security: [{oidc: []}]
      operationId: runCatalogDiscovery
      x-required-capability: catalog.write
      responses:
        '201': {description: Discovery job enqueued or deduplicated}

  /admin/claims:
    get:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: listAdminClaims
      x-required-capability: claim.read
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: subjectId
          in: query
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200': {description: Claims matching the filters}
    post:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: recordClaim
      x-required-capability: claim.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordClaimRequest'}
      responses:
        '201':
          description: Claim recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Claim'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/claims/{id}:
    get:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: getAdminClaim
      x-required-capability: claim.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Claim detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Claim'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/canonical-proposals:
    get:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: listCanonicalProposals
      x-required-capability: canonical.propose
      parameters:
        - name: status
          in: query
          schema: {type: string, default: PENDING}
      responses:
        '200': {description: Canonical proposals matching the status}
    post:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: createCanonicalProposal
      x-required-capability: canonical.propose
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCanonicalProposalRequest'}
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CanonicalProposal'}
  /admin/canonical-proposals/{id}:
    get:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: getCanonicalProposal
      x-required-capability: canonical.propose
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {description: Canonical proposal detail}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/canonical-proposals/{id}/decision:
    post:
      tags: [Admin Knowledge]
      security: [{oidc: []}]
      operationId: decideCanonicalProposal
      x-required-capability: canonical.decide
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CanonicalDecisionRequest'}
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CanonicalDecisionResult'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
        '422': {$ref: '#/components/responses/Validation'}

  /admin/media:
    get:
      tags: [Admin Media]
      security: [{oidc: []}]
      operationId: listAdminMedia
      x-required-capability: media.read
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: rights
          in: query
          schema: {$ref: '#/components/schemas/MediaRightsStatus'}
      responses:
        '200': {description: Media assets matching the filters}
    post:
      tags: [Admin Media]
      security: [{oidc: []}]
      operationId: registerMedia
      x-required-capability: media.review
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterMediaRequest'}
      responses:
        '201':
          description: Media registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAsset'}
  /admin/media/{id}/rights:
    post:
      tags: [Admin Media]
      security: [{oidc: []}]
      operationId: setMediaRights
      x-required-capability: media.review
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rightsStatus, expectedVersion]
              properties:
                rightsStatus: {$ref: '#/components/schemas/MediaRightsStatus'}
                expectedVersion: {type: integer, minimum: 1}
                basis: {type: string, minLength: 1}
                licenseName: {type: string}
                sourceUrl: {type: string, format: uri}
                expiresAt: {type: string, format: date-time}
                notes: {type: string}
      responses:
        '200': {description: Rights status updated}
        '409': {$ref: '#/components/responses/ConcurrentModification'}

  /admin/sources:
    get:
      tags: [Admin Sources]
      security: [{oidc: []}]
      operationId: listSources
      x-required-capability: source.read
      responses:
        '200': {description: Registered ingestion sources}
    post:
      tags: [Admin Sources]
      security: [{oidc: []}]
      operationId: registerSource
      x-required-capability: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSourceRequest'}
      responses:
        '201':
          description: Source registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
  /admin/ingestion/run:
    post:
      tags: [Admin Ingestion]
      security: [{oidc: []}]
      operationId: runIngestionTargets
      x-required-capability: source.write
      parameters:
        - name: kind
          in: query
          schema: {type: string}
      responses:
        '201':
          description: Eligible targets enqueued
          content:
            application/json:
              schema:
                type: object
                required: [enqueued]
                properties:
                  enqueued: {type: integer, minimum: 0}

  /admin/editorial:
    get:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: listAdminEditorial
      x-required-capability: editorial.read
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/EditorialType'}
      responses:
        '200': {description: Editorial content matching the filters}
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: createEditorialDraft
      x-required-capability: editorial.write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEditorialRequest'}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialContent'}
  /admin/editorial/{id}:
    get:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: getAdminEditorial
      x-required-capability: editorial.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Editorial content detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialContent'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: updateEditorialDraft
      x-required-capability: editorial.write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Editorial draft updated}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: removeEditorial
      x-required-capability: editorial.write
      description: Remove permanentemente o conteúdo editorial.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Removed
        '409': {$ref: '#/components/responses/ConcurrentModification'}
  /admin/editorial/{id}/publish:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: publishEditorial
      x-required-capability: editorial.publish
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialContent'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
  /admin/editorial/{id}/unpublish:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: unpublishEditorial
      x-required-capability: editorial.publish
      description: Retira o conteúdo publicado do ar, retornando-o ao estado DRAFT.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Unpublished (DRAFT)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminEditorialContent'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
 
  /admin/listings/{id}/prices:
    post:
      tags: [Admin Commerce]
      security: [{oidc: []}]
      operationId: recordPriceObservation
      x-required-capability: commerce.manage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordPriceRequest'}
      responses:
        '201':
          description: Price observation appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceObservation'}

  /admin/ai/registry:
    get:
      tags: [Admin AI]
      security: [{oidc: []}]
      operationId: getAIRegistry
      x-required-capability: ai.config.read
      responses:
        '200':
          description: Providers, models and workload policies without secrets
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /admin/ai/executions:
    get:
      tags: [Admin AI]
      security: [{oidc: []}]
      operationId: listAIExecutions
      x-required-capability: ai.execution.read
      responses:
        '200':
          description: Recent AI executions, individual provider attempts and workload budgets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AIExecutionLedger'}

  /admin/audit:
    get:
      tags: [Admin Operations]
      security: [{oidc: []}]
      operationId: listAuditEvents
      x-required-capability: audit.read
      parameters:
        - {name: actorId, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: subjectType, in: query, schema: {type: string}}
        - {name: subjectId, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Audit events matching the filters}
  /admin/audit/{id}:
    get:
      tags: [Admin Operations]
      security: [{oidc: []}]
      operationId: getAuditEvent
      x-required-capability: audit.read
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Audit event detail}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/editorial/candidates:
    get:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: listEditorialCandidates
      x-required-capability: editorial.read
      parameters:
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Story candidates matching the status}
  /admin/editorial/ingest-social:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: ingestSocialEditorialCandidate
      x-required-capability: editorial.write
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '201': {description: Social candidate ingested}
  /admin/editorial/ai-draft:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: createEditorialAIDraft
      x-required-capability: editorial.write
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '201': {description: AI draft generated under the configured workload policy}
  /admin/editorial/{id}/submit:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: submitEditorial
      x-required-capability: editorial.write
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201': {description: Editorial content submitted for review}
  /admin/editorial/{id}/approve:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: approveEditorial
      x-required-capability: editorial.approve
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201': {description: Editorial content approved}
  /admin/editorial/{id}/schedule:
    post:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: scheduleEditorial
      x-required-capability: editorial.publish
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '201': {description: Editorial publication scheduled}

  /admin/editorial-config/auto-draft:
    get:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: getEditorialAutoDraftConfig
      x-required-capability: editorial.read
      responses:
        '200': {description: Automatic draft configuration}
    put:
      tags: [Admin Editorial]
      security: [{oidc: []}]
      operationId: setEditorialAutoDraftConfig
      x-required-capability: editorial.write
