services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file: [.env]
    command: ["npm", "run", "db:migrate", "-w", "@portal/api"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file: [.env]
    command: ["npm", "run", "bootstrap", "-w", "@portal/api"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, minio]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
