services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]

  migrate:
    image: ${API_IMAGE}
    env_file: [.env.staging]
    command: ["npm","run","db:migrate","-w","@portal/api"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap:
    image: ${API_IMAGE}
    env_file: [.env.staging]
    command: ["npm","run","bootstrap","-w","@portal/api"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    image: ${API_IMAGE}
    env_file: [.env.staging]
    restart: unless-stopped
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3001/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    image: ${WORKER_IMAGE}
    env_file: [.env.staging]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  web:
    image: ${WEB_IMAGE}
    env_file: [.env.staging]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
