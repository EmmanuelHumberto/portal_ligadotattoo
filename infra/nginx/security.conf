# Baseline edge controls. Tune with measured production traffic.
limit_req_zone $binary_remote_addr zone=public_read:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=search:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server_tokens off;
client_max_body_size 25m;

# TLS termination should enable HSTS only on the production HTTPS hostname:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location /api/search/ {
  limit_req zone=search burst=10 nodelay;
  proxy_pass http://web;
}
location / {
  limit_req zone=public_read burst=40 nodelay;
  proxy_pass http://web;
}
