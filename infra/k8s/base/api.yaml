apiVersion: apps/v1
kind: Deployment
metadata: {name: portal-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: portal-api}}
  template:
    metadata: {labels: {app: portal-api}}
    spec:
      serviceAccountName: portal-api
      containers:
      - name: api
        image: PORTAL_API_IMAGE
        ports: [{containerPort: 3001}]
        envFrom:
        - configMapRef: {name: portal-runtime-config}
        - secretRef: {name: portal-api-secrets}
        readinessProbe:
          httpGet: {path: /health/ready, port: 3001}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health/live, port: 3001}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {cpu: 150m, memory: 256Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
