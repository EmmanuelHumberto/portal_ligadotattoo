apiVersion: apps/v1
kind: Deployment
metadata: {name: portal-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: portal-web}}
  template:
    metadata: {labels: {app: portal-web}}
    spec:
      containers:
      - name: web
        image: PORTAL_WEB_IMAGE
        ports: [{containerPort: 3000}]
        envFrom:
        - configMapRef: {name: portal-public-config}
        readinessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: "1", memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
